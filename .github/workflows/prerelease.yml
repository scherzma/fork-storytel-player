name: Pre-Release

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

on:
  push:
    tags:
      # Only pre-release semver tags (those carrying a "-" suffix, e.g. v1.4.0-beta.1).
      - "v*-*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Pre-release name (e.g. v1.4.0-beta.1) for the selected repository ref."
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: prerelease-${{ github.ref }}-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve build ref + tag
        id: meta
        env:
          REQUESTED_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          TAG="$REQUESTED_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            echo "::error::Pre-release names must use a form such as v1.4.0-beta.1. Received: $TAG"
            exit 1
          fi

          # Always build the immutable commit selected by the trusted repository
          # event. Fork pull-request refs are intentionally not accepted here
          # because build jobs receive release permissions and signing secrets.
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # electron-builder derives its release tag from package.json version (v<version>),
          # so we strip the leading "v" to feed it back in during the build step.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: Create or reuse the pre-release draft
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            IS_PRERELEASE=$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')
            if [ "$IS_DRAFT" != "true" ] || [ "$IS_PRERELEASE" != "true" ]; then
              echo "::error::Release $TAG already exists and is not a pre-release draft."
              exit 1
            fi
            EXISTING_SHA=$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.sha')
            if [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Release $TAG points to $EXISTING_SHA, not selected commit $GITHUB_SHA."
              exit 1
            fi
            echo "Resetting existing pre-release draft $TAG for a clean retry."
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              if [ -n "$asset" ]; then
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done
          else
            gh release create "$TAG" \
              --draft \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "Automated pre-release build."
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            script: electron:dist:linux
          - name: mac
            os: macos-latest
            script: electron:dist:mac
          - name: win
            os: windows-latest
            script: electron:dist:win

    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAC_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_CONTENT != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply pre-release version + flag
        env:
          REL_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Pin the package.json version to the requested tag and force every
          # publish target to "prerelease" so the GitHub release is flagged as such.
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.REL_VERSION;
            const markPrerelease = (node) => {
              if (!node || typeof node !== "object") return;
              if (node.publish && node.publish.releaseType) node.publish.releaseType = "prerelease";
              for (const key of Object.keys(node)) markPrerelease(node[key]);
            };
            markPrerelease(pkg.build || {});
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("Building pre-release v" + pkg.version);
          '
          node scripts/sync-version.js

      - name: Build
        run: npm run ci:install-all

      # macOS notarization uses the App Store Connect API key. The .p8 is stored
      # base64-encoded in APPLE_API_KEY_CONTENT and decoded into a temp file.
      - name: Prepare Apple API key (macOS only)
        if: runner.os == 'macOS' && env.MAC_SIGNING_CONFIGURED == 'true'
        run: |
          echo "${{ secrets.APPLE_API_KEY_CONTENT }}" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      - name: Publish pre-release (Windows and Linux)
        if: runner.os != 'macOS'
        run: npm run ${{ matrix.script }} -- --publish always

      - name: Publish signed macOS pre-release
        if: runner.os == 'macOS' && env.MAC_SIGNING_CONFIGURED == 'true'
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run ${{ matrix.script }} -- --publish always

      - name: Publish ad-hoc signed macOS pre-release
        if: runner.os == 'macOS' && env.MAC_SIGNING_CONFIGURED != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }} -- --publish always -c.mac.identity=- -c.mac.notarize=false

  publish:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Publish checksums and the completed pre-release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          IS_PRERELEASE=$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')
          if [ "$IS_DRAFT" != "true" ] || [ "$IS_PRERELEASE" != "true" ]; then
            echo "::error::Release $TAG is no longer an unpublished pre-release draft."
            exit 1
          fi

          mkdir release-assets
          gh release download "$TAG" --dir release-assets
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber

          gh release edit "$TAG" \
            --draft=false \
            --prerelease=true
