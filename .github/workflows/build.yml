name: Stable Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

defaults:
  run:
    shell: bash

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate stable tag and package version
        id: release
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable release tags must use the exact form vX.Y.Z. Received: $TAG"
            exit 1
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi

          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          LOCK_ROOT_VERSION=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "$LOCK_VERSION" != "$PACKAGE_VERSION" ] || [ "$LOCK_ROOT_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::package-lock.json is not synchronized with package.json."
            exit 1
          fi

          for version_file in src/version.ts client/src/version.ts; do
            if ! grep -Fxq "export const APP_VERSION = \"$PACKAGE_VERSION\";" "$version_file"; then
              echo "::error::$version_file is not synchronized with package.json."
              exit 1
            fi
          done

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: npm run ci:install-all

      - name: Run server tests
        run: npm test

      - name: Build client
        run: npm run build

      - name: Build server
        run: npm run server:build

      - name: Type-check and build Electron
        run: npm run electron:build

      - name: Prepare release notes from the changelog
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            index($0, "## " version " ") == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no release notes for version $VERSION."
            exit 1
          fi

      - name: Create or reuse the draft release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            IS_PRERELEASE=$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')
            if [ "$IS_DRAFT" != "true" ] || [ "$IS_PRERELEASE" != "false" ]; then
              echo "::error::Release $TAG already exists and is not a stable draft."
              exit 1
            fi
            echo "Resetting existing stable draft $TAG for a clean retry."
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              if [ -n "$asset" ]; then
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --notes-file release-notes.md
          fi

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm run ci:install-all

      - name: Build and upload Linux artifacts
        run: npm run electron:dist:linux -- --publish always

  dmg:
    needs: prepare
    runs-on: macos-latest
    env:
      MAC_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_CONTENT != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm run ci:install-all

      - name: Prepare Apple API key
        if: env.MAC_SIGNING_CONFIGURED == 'true'
        run: |
          echo "${{ secrets.APPLE_API_KEY_CONTENT }}" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, and upload macOS artifacts
        if: env.MAC_SIGNING_CONFIGURED == 'true'
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run electron:dist:mac -- --publish always

      - name: Build, ad-hoc sign, and upload macOS artifacts
        if: env.MAC_SIGNING_CONFIGURED != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run electron:dist:mac -- --publish always -c.mac.identity=- -c.mac.notarize=false

  exe:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm run ci:install-all

      - name: Build and upload Windows x64 artifacts
        run: npm run electron:dist:win -- --publish always

  publish:
    needs:
      - prepare
      - linux
      - dmg
      - exe
    runs-on: ubuntu-latest
    steps:
      - name: Verify artifacts, publish checksums, and release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          IS_PRERELEASE=$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')
          if [ "$IS_DRAFT" != "true" ] || [ "$IS_PRERELEASE" != "false" ]; then
            echo "::error::Release $TAG is no longer an unpublished stable draft."
            exit 1
          fi

          mkdir release-assets
          gh release download "$TAG" --dir release-assets

          require_asset() {
            local pattern="$1"
            local label="$2"
            if ! compgen -G "$pattern" >/dev/null; then
              echo "::error::The draft is missing its $label artifact ($pattern)."
              exit 1
            fi
          }

          require_asset "release-assets/*Setup*.exe" "Windows x64"
          require_asset "release-assets/*-mac-x64.dmg" "macOS x64"
          require_asset "release-assets/*-mac-arm64.dmg" "macOS arm64"
          require_asset "release-assets/*_amd64.deb" "Linux x64"
          require_asset "release-assets/*_arm64.deb" "Linux arm64"
          require_asset "release-assets/*_armv7l.deb" "Linux armv7l"

          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber

          gh release edit "$TAG" \
            --draft=false \
            --prerelease=false \
            --latest
